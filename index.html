<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenSpatial - Virtual Office</title>
    <meta name="description" content="A virtual space where distance disappears — spatial audio and shared canvas for gatherings of any kind">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Critical CSS to prevent FOUC - hide until main CSS loads -->
    <style>
        body { opacity: 0; background: #f0f0ff; }
        body.loaded { opacity: 1; transition: opacity 0.15s ease; }
    </style>
    <!-- CSS is imported in main.tsx and bundled by Vite with cache-busting hash -->
</head>
<body class="h-full overflow-hidden font-['Inter',-apple-system,BlinkMacSystemFont,sans-serif] text-base text-text-primary bg-bg-primary bg-[radial-gradient(ellipse_at_center,#1a1a2e_0%,#0a0a0f_70%)] leading-normal antialiased">
    <div id="app"></div>
    <script type="module" src="/client/main.tsx"></script>
</body>
</html>
